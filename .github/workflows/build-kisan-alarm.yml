name: Build Kisan Alarm APK

on:
  push:
    paths:
      - 'kisan_alarm*.zip'
      - '.github/workflows/build-kisan-alarm.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract zip
        run: |
          set -e
          rm -rf src && mkdir src
          ZIP=$(ls kisan_alarm*.zip | sort -V | tail -n 1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d src
          if [ ! -f src/pubspec.yaml ]; then
            d=$(dirname "$(find src -name pubspec.yaml | head -1)")
            mv "$d" src_fixed && rm -rf src && mv src_fixed src
          fi
          ls -R src

      - name: Create Android scaffold and apply project files
        run: |
          set -e
          mkdir build_app && cd build_app
          flutter create --project-name kisan_alarm --org com.manav.kisanalarm --platforms=android .
          rm -rf lib test analysis_options.yaml
          cp -r ../src/lib ./lib
          cp ../src/pubspec.yaml ./pubspec.yaml
          python3 ../src/tools/patch_android.py

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Rename APK with unique name
        run: |
          NAME="KisanAlarm-v${{ github.run_number }}-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}.apk"
          cp build_app/build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
